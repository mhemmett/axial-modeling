source_documents:
  main:
    title: "Cabaniss et al. (2020), Triggering of eruptions at Axial Seamount, Juan de Fuca Ridge"
    url: https://doi.org/10.1038/s41598-020-67043-0
    accessed: 2026-10-23
  supp:
    title: "Publisher-served supplementary information"
    url: "https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41598-020-67043-0/MediaObjects/41598_2020_67043_MOESM1_ESM.pdf"
    accessed: 2026-10-23
    sha256: bd460be233f7faeacddc776a3d30ba5ac868984617002da64451078281fa5de8
    version_note: "The publisher-linked PDF was checked on 2026-10-23 and retains the manuscript footer. No replacement version was established; see source_audit.md."

study:
  title: "Triggering of eruptions at Axial Seamount, Juan de Fuca Ridge"
  doi: 10.1038/s41598-020-67043-0
  deformation_record_years:
    value: 22
    units: year
    source: {doc: main, location: "Modeling historical eruptions of Axial Seamount"}
    confidence: extracted

project_setup:
  source: "Legacy prototype choices from 2026-10-09; superseded as reproduction specifications by the instruction to follow Cabaniss on 2026-10-23."
  coordinate_system: {x: east, y: north, z: up}
  domain_dimensions:
    value: [50, 50, 10]
    axes: [x_east, y_north, z_up]
    units: km
    vertical_extent: "0 km seafloor to 10 km depth"
  youngs_modulus:
    range:
      value: [20, 50]
      units: GPa
    interpolation: "E(T) = 50 - 30 clip(T / 1200, 0, 1) GPa"
    temperature_endpoints:
      value: [0, 1200]
      units: degree_C
    rationale: "Owner-specified range; linear interpolation is an explicit project assumption, not the printed Eq. 16."
  reservoir:
    representation: "pressurized ellipsoidal void with boundary traction"
    separate_fluid_elements: false
    orientation:
      strike_azimuth:
        value: 330
        units: degree_clockwise_from_north
        source: {doc: supp, location: "Model Set-up; reservoir orientation"}
        confidence: extracted
      dip:
        value: 0
        units: degree
        source: {doc: supp, location: "Model Set-up; reservoir orientation"}
        confidence: extracted
      coordinate_rotation: "120 degrees counterclockwise from +x (east) about z"

paper_model:
  domain_dimensions:
    value: unresolved
    units: km
    source: {doc: supp, location: "Model Set-up; Fig. S5"}
    confidence: unresolved
    rationale: "The Cabaniss written description does not report numerical box dimensions; the current 50 x 50 x 10 km prototype is a separate project choice requiring boundary convergence."
  reservoir:
    shape: ellipsoid
    primary_case:
      dimensions:
        value: [6, 3, 1]
        axes: [length, width, thickness]
        units: km
        source: {doc: main, location: "Modeling historical eruptions of Axial Seamount; Fig. 1 caption"}
        confidence: extracted
      center_depth:
        value: 1.6
        units: km_below_seafloor
        source: {doc: main, location: "Modeling historical eruptions of Axial Seamount"}
        confidence: extracted
      related_supplement_geometry:
        table_depth:
          value: 1.1
          units: km_below_seafloor
          source: {doc: supp, location: "Table S3, Partial Res. BSF 1.1"}
          confidence: extracted
        interpretation: "Table S3 does not say whether depth is to the top, center, or another reference; the main text independently specifies the center at 1.6 km."
    sensitivity_cases:
      - name: "Full Res. BSF 1.1"
        table_depth: 1.1
        dimensions: [14, 3, 1]
        units: km
        source: {doc: supp, location: "Table S3"}
        confidence: extracted
      - name: "Partial Res. BSF 1.1"
        table_depth: 1.1
        dimensions: [6, 3, 1]
        units: km
        source: {doc: supp, location: "Table S3"}
        confidence: extracted
      - name: "Partial Res. BSF 2.8"
        table_depth: 2.8
        dimensions: [6, 3, 1]
        units: km
        source: {doc: supp, location: "Table S3"}
        confidence: extracted
    depth_notes:
      - "Supplementary prose calls the deep partial-reservoir center 2.6 km while Table S3 lists depth 2.8 km."
      - "The supplement describes the full reservoir as extending from 1.1 to 2.8 km below seafloor, while Table S3 lists a 1 km thickness and depth 1.1 km."
  rheologies:
    - "non-temperature-dependent elastic"
    - "non-temperature-dependent viscoelastic"
    - "temperature-dependent viscoelastic"
    - "temperature-dependent viscoelastic with hydrothermal circulation"
  boundary_conditions:
    lateral: "roller; horizontal motion constrained on lateral margins"
    base: "Winkler spring foundation"
    tectonic_loading:
      main_text_full_rate:
        value: 60
        units: mm/year
        source: {doc: main, location: "Tectonic controls on eruption mechanics"}
        confidence: extracted
      supplement_prescribed_velocity:
        value: [-20, 20]
        units: mm/year
        source: {doc: supp, location: "Table S1, Pv"}
        confidence: extracted
      implementation: "Static diagnostic compares 0, +/-20, and +/-30 mm/year per face; x faces are prescribed one-year displacements."
      rationale: "The +/-20 mm/year case tests the Table S1 range as a per-face value; +/-30 mm/year gives the 60 mm/year full rate. The project x/east direction has not been reconciled with the geographic ridge-normal azimuth, and the runs do not include Maxwell memory."
  material_properties:
    youngs_modulus:
      non_td_uniform_maxwell:
        value: 60
        units: GPa
        source: {doc: main, location: "Figure 3, non-temperature-dependent viscoelastic Young's modulus color"}
        confidence: inferred_from_figure
        rationale: "Table S1 separately gives 60 GPa for the analytical solution; the FEM modulus is not explicitly tabulated."
      brittle_value:
        value: 50
        units: GPa
        source: {doc: supp, location: "Table S1, EB"}
        confidence: extracted
      ductile_value:
        value: 25
        units: GPa
        source: {doc: supp, location: "Table S1, ED"}
        confidence: extracted
      temperature_function: "E(T) = ED + EB / (1 + CS * exp(AS * (1 - T/Tmax)))"
      function_source: {doc: supp, location: "Eq. 16"}
      function_notes: "Eq. 16 defines Tmax as magma-chamber temperature; Table S1 also uses Tmax=600 °C for the separate hydrothermal cutoff. Preserve these as distinct parameters. As printed, Eq. 16 makes E increase with temperature for the listed positive AS and CS, contrary to the table's brittle/ductile descriptions. The source-value Maxwell workflow uses the literal equation as a labeled diagnostic, not as a resolved brittle-to-ductile law."
    poisson_ratio:
      value: unresolved
      units: dimensionless
      source: {doc: supp, location: "Table S1; Eqs. 10, 17, and 18"}
      confidence: unresolved
      rationale: "The equations use nu but the table does not provide its numerical value."
    viscosity:
      temperature_function: "eta(T) = AD * exp(EA / (Rg * T))"
      function_source: {doc: supp, location: "Eq. 15"}
      non_td_uniform_value: {value: 10000000000000000, units: "Pa s", source: {doc: main, location: "Figure 3, non-temperature-dependent viscoelastic panel"}, confidence: extracted}
      parameters:
        AD: {value: 1000000000, units: "Pa s", source: "Table S1", confidence: extracted}
        EA: {value: 120000, units: "J/mol", source: "Table S1", confidence: extracted}
        Rg: {value: 8.3114, units: "J/(mol K)", source: "Table S1", confidence: extracted}
      notes: "Temperature must be absolute in Eq. 15. Figure 3 labels the non-temperature-dependent viscoelastic viscosity as 10^16 Pa s, although Table S1 omits it. The generalized Maxwell branch spectrum remains unspecified."
    temperature_dependent_modulus_parameters:
      AS: {value: 12, units: dimensionless, source: "Table S1", confidence: extracted}
      CS: {value: 5, units: dimensionless, source: "Table S1", confidence: extracted}
    failure:
      cohesion:
        value: 1000000
        units: Pa
        source: {doc: supp, location: "Table S1, C"}
        confidence: extracted
      friction_angle:
        value: 25
        units: degree
        source: {doc: supp, location: "Table S1, f"}
        confidence: extracted
      criterion: "tau = C + f * sigma_n"
      criterion_source: {doc: supp, location: "Eq. 25"}
      friction_note: "Table S1 calls f an angle, while Eq. 25 uses f as a coefficient. Use the tabulated phi = 25 degrees, equivalent to coefficient tan(25 degrees). Literal dimensionless f = 25 does not preserve Table S1 units and is not a paper case."
      tensile_strength:
        value: unresolved
        units: Pa
        source: {doc: supp, location: "Quantifying Mechanical Failure; Table S1"}
        confidence: unresolved
        rationale: "The supplement defines tensile failure but does not list a tensile-strength parameter."
    gravity:
      value: 9.81
      units: m/s^2
      source: {doc: supp, location: "Table S1, g"}
      confidence: extracted
    analytical_benchmark:
      youngs_modulus: {value: 60, units: GPa, source: "Table S1", confidence: extracted}
      spherical_source_radius: {value: 0.7, units: km, source: "Table S1", confidence: extracted}
      spherical_source_depth: {value: 4, units: km, source: "Table S1", confidence: extracted}
      shear_modulus: "E / (2 * (1 + nu))"
      bulk_modulus: "E / (3 * (1 - 2 * nu))"
  thermal_model:
    method: "steady-state heat conduction: div(k * grad(T)) = -Q"
    method_source: {doc: supp, location: "Eq. 14"}
    initial_background_geotherm:
      value: 30
      units: degC/km
      source: {doc: supp, location: "Fig. S5 caption"}
      confidence: extracted
    surface_temperature:
      value: 0
      units: degC
      source: {doc: supp, location: "Fig. S5 caption"}
      confidence: extracted
    reservoir_boundary_temperature:
      value: 1200
      units: degC
      source: {doc: supp, location: "Table S1 Tc; Fig. S5 caption"}
      confidence: extracted
    volumetric_heat_production:
      value: 0
      units: "source table labels °C; Eq. 14 implies volumetric heat-production units"
      source: {doc: supp, location: "Table S1 Q; Eq. 14"}
      confidence: extracted_with_unit_error
    reference_conductivity:
      value: 3
      units: W/(m K)
      source: {doc: supp, location: "Table S1 k0"}
      confidence: extracted
    hydrothermal:
      nusselt_number: {value: 8, units: dimensionless, source: "Table S1 Nu", confidence: extracted}
      smoothing_coefficient: {value: 0.75, units: dimensionless, source: "Table S1 A", confidence: extracted}
      cutoff_temperature: {value: 600, units: degC, source: "Table S1 Tmax", confidence: extracted}
      cutoff_depth: {value: 6, units: km, source: "Table S1 zmax", confidence: extracted}
      conductivity_function: "k = k0 + k0*(Nu - 1)*exp(A*(1 - T/Tmax))*exp(A*(1 - z/zmax))"
      function_source: {doc: supp, location: "Eq. 22"}
    viscosity_temperature_units: "Eq. 15 requires kelvin; other thermal temperatures are reported in degrees Celsius. Convert only at the equation boundary."
  pressure_loading:
    reservoir_boundary_load: "MagmaLd = deltaP + rho_r * g * z"
    source: {doc: supp, location: "Eq. 24"}
    unresolved: "The host-rock density rho_r and detailed sign convention are not listed in Table S1."
  winkler_foundation:
    stiffness: "s = rho * V * g / Zdisp"
    source: {doc: supp, location: "Eq. 23"}
    benchmark_displacement:
      value: 1.0e-10
      units: m
      source: {doc: supp, location: "Model Set-up"}
      confidence: extracted
    notes: "Eq. 23 defines total stiffness in N/m; distributed basal traction needs division by base area. With the provisional Axial upper-edifice density 2700 kg/m3, legacy 50x50x10 km domain, gravity 9.81 m/s2, and Zdisp=1e-10 m, the derived area stiffness is 2.6487e18 Pa/m. It remains effectively fixed in displacement response. This paper benchmark is separate from the regional prior under project_assumptions.regional_winkler_calibration. Production pressure calibrations retain a fixed base and are not paper reproductions."

unavailable_or_ambiguous:
  - "Cabaniss's original numerical box dimensions, mesh resolution, element count, timestep control, and solver tolerances. The 50 x 50 x 10 km project prototype is not a paper-specified extent."
  - "The paper's exact Center BPR channel, deployment offsets, model timestep, and initialization over the 1998-2011 and 2011-2015 cycles. Archived observations are eligible inputs; paper model outputs are excluded."
  - "Generalized Maxwell fractional moduli and relaxation spectrum. Figure 3 gives a 10^16 Pa s uniform non-temperature-dependent viscosity, but its exact FEM modulus assignment is not tabulated."
  - "Poisson ratio, Axial depth-dependent host-rock density, and tensile-strength value."
  - "Eq. 25 calls f a coefficient while Table S1 reports a 25 degree friction angle. The dimensionally consistent coefficient is tan(25 degrees); the paper does not spell out the conversion."
  - "Eq. 16 makes Young's modulus increase with temperature as printed, conflicting with the stated brittle/ductile modulus descriptions."
  - "Geographic orientation of the project x/east faces relative to the ridge-normal extension direction in Cabaniss et al.; current static loading is an axis-aligned diagnostic."
  - "The calibrated regional Winkler and lithostatic priors need local Axial constraints and a PyLith gravity/initial-stress equilibrium solve before absolute stresses are compared."
  - "Reference-depth semantics for Table S3 geometry and the 2.6 versus 2.8 km deep-reservoir discrepancy."
  - "The publisher-linked supplement retains its manuscript footer as verified on 2026-10-23. The printed equation conflicts remain unresolved in that source."

project_assumptions:
  smoke_pressure: {value: 10, units: MPa, source: "Phase 0 smoke-test choice", confidence: inferred}
  smoke_elastic_properties:
    density: {value: 2700, units: kg/m^3, source: "Hildebrand et al. (1990), uppermost Axial volcano; provisional whole-column prior", confidence: literature_prior}
    youngs_modulus: {value: 50000000000, units: Pa, source: "smoke-test choice", confidence: inferred}
    poisson_ratio: {value: 0.25, units: dimensionless, source: "smoke-test choice", confidence: inferred}
  mesh_sizes:
    near_reservoir: {value: 1.2, units: km, source: "Phase 0 coarse-mesh choice", confidence: inferred}
    far_field: {value: 10, units: km, source: "Phase 0 coarse-mesh choice", confidence: inferred}
    maximum_tetrahedra: {value: 10000, units: tetrahedra, source: "Phase 0 mesh limit", confidence: inferred}
  regional_winkler_calibration:
    source_equation: "k_W = rho_asthenosphere * g; t_z0 = g * sum(rho_i * H_i)"
    galgana_source: "Galgana et al. (2011), section 2.2; Le Corvec et al. (2015), Eq. 5"
    regional_prior:
      crust_density: {value: 2700, units: kg/m^3, source: "Marjanovic et al. (2011), along-axis model", confidence: literature_prior}
      crust_thickness: {value: 6, units: km, source: "Marjanovic et al. (2011), along-axis model", confidence: literature_prior}
      upper_mantle_density: {value: 3300, units: kg/m^3, source: "Marjanovic et al. (2011), upper-mantle model", confidence: literature_prior}
      mantle_thickness_in_project_box: {value: 4, units: km, source: "10 km project depth minus 6 km regional crust", confidence: derived}
    gravity: {value: 9.81, units: m/s^2, source: "supplement Table S1", confidence: extracted}
    calibrated_area_stiffness: {value: 32373, units: Pa/m, source: "3300 kg/m^3 * 9.81 m/s^2", confidence: derived}
    basal_lithostatic_reference:
      value: 288414000
      units: Pa
      global_vertical_sign: "positive upward; bottom-normal value is negative"
      source: "9.81 * (2700 * 6000 + 3300 * 4000)"
      confidence: derived_from_regional_prior
    use: "Regional starting calibration; the static diagnostic initializes gravity and the absolute basal prestress using a depth-averaged column density, then evaluates pressure and tectonic increments about that equilibrium."
