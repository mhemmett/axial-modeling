[pylithapp]
problem.defaults.name = step16_winkler_foundation

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Static elastic response with a displacement-dependent basal spring.
arguments = [winkler.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem]
bc = [bc_cavity, bc_x_neg, bc_x_pos, bc_y_neg, bc_y_pos, bc_bottom, bc_base_anchor]
bc.bc_cavity = pylith.bc.NeumannTimeDependent
bc.bc_x_neg = pylith.bc.DirichletTimeDependent
bc.bc_x_pos = pylith.bc.DirichletTimeDependent
bc.bc_y_neg = pylith.bc.DirichletTimeDependent
bc.bc_y_pos = pylith.bc.DirichletTimeDependent
bc.bc_bottom = pylith.bc.NeumannTimeDependent
bc.bc_base_anchor = pylith.bc.DirichletTimeDependent
solver = linear

[pylithapp.timedependent]
start_time = 0.0*s
initial_dt = 1.0*s
end_time = 1.0*s

[pylithapp.problem.bc.bc_cavity]
label = cavity
label_value = 101
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Unit cavity pressure traction
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_cavity.spatialdb

[pylithapp.problem.bc.bc_x_neg]
label = x_neg
label_value = 104
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x negative face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_x_pos]
label = x_pos
label_value = 105
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x positive face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_neg]
label = y_neg
label_value = 106
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y negative face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_pos]
label = y_pos
label_value = 107
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y positive face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_bottom]
label = bottom
label_value = 103
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Iterated Galgana Winkler traction in bottom-normal coordinates
db_auxiliary_field.iohandler.filename = output/winkler-traction.spatialdb
db_auxiliary_field.query_type = nearest

[pylithapp.problem.bc.bc_base_anchor]
label = base_anchor
label_value = 108
constrained_dof = [2]
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Short edge gauge for vertical rigid translation
db_auxiliary_field.iohandler.filename = output/base-anchor.spatialdb
db_auxiliary_field.query_type = nearest
