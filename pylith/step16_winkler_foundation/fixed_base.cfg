[pylithapp]
problem.defaults.name = step16_winkler_fixed_base_reference

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Fixed-base reference on the same mesh as the Winkler check.
arguments = [fixed_base.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem]
bc = [bc_cavity, bc_x_neg, bc_x_pos, bc_y_neg, bc_y_pos, bc_bottom, bc_base_anchor]
bc.bc_cavity = pylith.bc.NeumannTimeDependent
bc.bc_x_neg = pylith.bc.DirichletTimeDependent
bc.bc_x_pos = pylith.bc.DirichletTimeDependent
bc.bc_y_neg = pylith.bc.DirichletTimeDependent
bc.bc_y_pos = pylith.bc.DirichletTimeDependent
bc.bc_bottom = pylith.bc.DirichletTimeDependent
bc.bc_base_anchor = pylith.bc.DirichletTimeDependent
solver = linear

[pylithapp.timedependent]
start_time = 0.0*s
initial_dt = 1.0*s
end_time = 1.0*s

[pylithapp.problem.solution_observers.domain]
writer.filename = output/fixed-base-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
writer.filename = output/fixed-base-surface.h5

[pylithapp.problem.materials.elastic]
observers.observer.writer.filename = output/fixed-base-material.h5

[pylithapp.problem.bc.bc_cavity]
label = cavity
label_value = 101
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Unit cavity pressure traction
db_auxiliary_field.iohandler.filename = output/cavity-pressure.spatialdb

[pylithapp.problem.bc.bc_x_neg]
label = x_neg
label_value = 104
constrained_dof = [0]
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Prescribed x displacement on x negative face
db_auxiliary_field.iohandler.filename = output/tectonic-x-neg.spatialdb

[pylithapp.problem.bc.bc_x_pos]
label = x_pos
label_value = 105
constrained_dof = [0]
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Prescribed x displacement on x positive face
db_auxiliary_field.iohandler.filename = output/tectonic-x-pos.spatialdb

[pylithapp.problem.bc.bc_y_neg]
label = y_neg
label_value = 106
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y negative face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_pos]
label = y_pos
label_value = 107
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y positive face
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_bottom]
label = bottom
label_value = 103
constrained_dof = [2]
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Fixed-base vertical displacement
db_auxiliary_field.iohandler.filename = ../step05_ellipsoid_elastic/bc_zero.spatialdb

[pylithapp.problem.bc.bc_base_anchor]
label = base_anchor
label_value = 108
constrained_dof = [2]
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Fixed vertical displacement on bottom gauge patch
db_auxiliary_field.iohandler.filename = output/base-anchor.spatialdb
db_auxiliary_field.query_type = nearest
