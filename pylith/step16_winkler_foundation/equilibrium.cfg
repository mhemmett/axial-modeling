[pylithapp]
problem.defaults.name = step16_lithostatic_winkler_equilibrium

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Gravity and lithostatic reference-state equilibrium for the Winkler base.
arguments = [winkler.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem.solution_observers.domain]
writer.filename = output/winkler-equilibrium-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
writer.filename = output/winkler-equilibrium-surface.h5

[pylithapp.problem.materials.elastic]
observers.observer.writer.filename = output/winkler-equilibrium-material.h5
