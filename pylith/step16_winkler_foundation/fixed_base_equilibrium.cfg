[pylithapp]
problem.defaults.name = step16_lithostatic_fixed_base_equilibrium

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Gravity and lithostatic reference-state equilibrium for a fixed base.
arguments = [fixed_base.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem.solution_observers.domain]
writer.filename = output/fixed-base-equilibrium-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
writer.filename = output/fixed-base-equilibrium-surface.h5

[pylithapp.problem.materials.elastic]
observers.observer.writer.filename = output/fixed-base-equilibrium-material.h5
