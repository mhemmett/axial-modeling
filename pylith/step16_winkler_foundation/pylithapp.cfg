[pylithapp.metadata]
keywords = [Axial Seamount, Winkler foundation, ellipsoidal cavity, elasticity]

[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader = pylith.meshio.MeshIOPetsc
reader.filename = mesh/axial_ellipsoid.msh
reader.coordsys.space_dim = 3

[pylithapp.problem]
solution_observers = [domain, ground_surface]
solution_observers.ground_surface = pylith.meshio.OutputSolnBoundary
defaults.quadrature_order = 2

[pylithapp.problem.solution.subfields.displacement]
basis_order = 2

[pylithapp.problem.solution_observers.domain]
writer.filename = output/winkler-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
label = top
label_value = 102
writer.filename = output/winkler-surface.h5

[pylithapp.problem]
gravity_field = spatialdata.spatialdb.GravityField
gravity_field.gravity_dir = [0.0, 0.0, -1.0]
gravity_field.acceleration = 9.81*meter/second**2
materials = [elastic]

[pylithapp.problem.materials.elastic]
label_value = 1
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Column-averaged density and lithostatic reference stress
db_auxiliary_field.iohandler.filename = output/reference-state.spatialdb
db_auxiliary_field.query_type = linear
auxiliary_subfields.density.basis_order = 0
auxiliary_subfields.gravitational_acceleration.basis_order = 0
bulk_rheology.use_reference_state = True
bulk_rheology.auxiliary_subfields.reference_stress.basis_order = 1
bulk_rheology.auxiliary_subfields.reference_strain.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
observers.observer.data_fields = [displacement, cauchy_stress, cauchy_strain]
observers.observer.writer.filename = output/winkler-material.h5
derived_subfields.cauchy_stress.basis_order = 0
derived_subfields.cauchy_strain.basis_order = 0
