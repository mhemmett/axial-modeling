[pylithapp.metadata]
keywords = [Axial Seamount, one-branch Maxwell, state evolution smoke test]

[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader = pylith.meshio.MeshIOPetsc
reader.filename = mesh/axial_ellipsoid.msh
reader.coordsys.space_dim = 3

[pylithapp.problem]
solution_observers = [domain, ground_surface]
solution_observers.ground_surface = pylith.meshio.OutputSolnBoundary

[pylithapp.problem.solution_observers.domain]
writer.filename = output/maxwell-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
label = top
label_value = 102
writer.filename = output/maxwell-surface.h5

[pylithapp.problem]
materials = [elastic]

[pylithapp.problem.materials.elastic]
label_value = 1
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Assumed uniform single-branch Maxwell properties
db_auxiliary_field.iohandler.filename = material_initial.spatialdb
auxiliary_subfields.density.basis_order = 0
bulk_rheology = pylith.materials.IsotropicLinearMaxwell
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.maxwell_time.basis_order = 0
bulk_rheology.auxiliary_subfields.viscous_strain.basis_order = 0
bulk_rheology.auxiliary_subfields.total_strain.basis_order = 0
observers.observer.data_fields = [displacement, cauchy_stress, cauchy_strain, viscous_strain]
observers.observer.writer.filename = output/maxwell-material.h5
derived_subfields.cauchy_stress.basis_order = 0
derived_subfields.cauchy_strain.basis_order = 0
