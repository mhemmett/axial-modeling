[pylithapp]
problem.defaults.name = step01_restart

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Second one-second Maxwell loading segment initialized from step01 output.
arguments = [step01_restart.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem]
bc = [bc_cavity, bc_x_neg, bc_x_pos, bc_y_neg, bc_y_pos, bc_bottom]
bc.bc_cavity = pylith.bc.NeumannTimeDependent
bc.bc_x_neg = pylith.bc.DirichletTimeDependent
bc.bc_x_pos = pylith.bc.DirichletTimeDependent
bc.bc_y_neg = pylith.bc.DirichletTimeDependent
bc.bc_y_pos = pylith.bc.DirichletTimeDependent
bc.bc_bottom = pylith.bc.DirichletTimeDependent
solver = linear

[pylithapp.timedependent]
start_time = 1.0*s
initial_dt = 1.0*s
end_time = 2.0*s

[pylithapp.problem.bc.bc_cavity]
label = cavity
label_value = 101
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Cavity pressure traction
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_cavity.spatialdb

[pylithapp.problem.bc.bc_x_neg]
label = x_neg
label_value = 104
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x negative face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_x_pos]
label = x_pos
label_value = 105
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x positive face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_neg]
label = y_neg
label_value = 106
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y negative face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_pos]
label = y_pos
label_value = 107
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y positive face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_bottom]
label = bottom
label_value = 103
constrained_dof = [2]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Fixed base for restart verification
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem]
ic = [domain]
ic.domain = pylith.problems.InitialConditionDomain

[pylithapp.problem.ic.domain]
subfields = [displacement]
db = spatialdata.spatialdb.SimpleDB
db.description = Previous-run displacement at mesh vertices
db.query_type = nearest
db.iohandler.filename = output/restart_displacement.spatialdb

[pylithapp.problem.materials.elastic]
bulk_rheology = pylith.materials.IsotropicLinearMaxwell
db_auxiliary_field = spatialdata.spatialdb.CompositeDB
db_auxiliary_field.description = Maxwell material properties and transferred state

[pylithapp.problem.materials.elastic.db_auxiliary_field]
values_A = [density, vs, vp, viscosity]
db_A = spatialdata.spatialdb.SimpleDB
db_A.description = Constant Maxwell material properties
db_A.iohandler.filename = material_properties.spatialdb
values_B = [viscous_strain_xx, viscous_strain_yy, viscous_strain_zz, viscous_strain_xy, viscous_strain_yz, viscous_strain_xz, total_strain_xx, total_strain_yy, total_strain_zz, total_strain_xy, total_strain_yz, total_strain_xz]
db_B = spatialdata.spatialdb.SimpleDB
db_B.description = Restarted Maxwell state at tetrahedron centroids
db_B.query_type = nearest
db_B.iohandler.filename = output/restart_state.spatialdb

[pylithapp.problem.materials.elastic.bulk_rheology]
auxiliary_subfields.bulk_modulus.basis_order = 0
auxiliary_subfields.shear_modulus.basis_order = 0
auxiliary_subfields.maxwell_time.basis_order = 0
auxiliary_subfields.viscous_strain.basis_order = 0
auxiliary_subfields.total_strain.basis_order = 0

[pylithapp.problem.materials.elastic]
observers.observer.writer.filename = output/restart-material.h5

[pylithapp.problem.solution_observers.domain]
writer.filename = output/restart-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
writer.filename = output/restart-surface.h5
