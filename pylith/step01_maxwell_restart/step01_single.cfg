[pylithapp]
problem.defaults.name = step01_single

[pylithapp.metadata]
base = [pylithapp.cfg]
description = Continuous two-second Maxwell cavity loading reference.
arguments = [step01_single.cfg]
version = 1.0.0
pylith_version = [>=5.0, <6.0]

[pylithapp.problem]
bc = [bc_cavity, bc_x_neg, bc_x_pos, bc_y_neg, bc_y_pos, bc_bottom]
bc.bc_cavity = pylith.bc.NeumannTimeDependent
bc.bc_x_neg = pylith.bc.DirichletTimeDependent
bc.bc_x_pos = pylith.bc.DirichletTimeDependent
bc.bc_y_neg = pylith.bc.DirichletTimeDependent
bc.bc_y_pos = pylith.bc.DirichletTimeDependent
bc.bc_bottom = pylith.bc.DirichletTimeDependent
solver = linear

[pylithapp.timedependent]
start_time = 0.0*s
initial_dt = 1.0*s
end_time = 2.0*s

[pylithapp.problem.bc.bc_cavity]
label = cavity
label_value = 101
use_initial = True
use_rate = False
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Cavity pressure traction
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_cavity.spatialdb

[pylithapp.problem.bc.bc_x_neg]
label = x_neg
label_value = 104
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x negative face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_x_pos]
label = x_pos
label_value = 105
constrained_dof = [0]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on x positive face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_neg]
label = y_neg
label_value = 106
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y negative face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_y_pos]
label = y_pos
label_value = 107
constrained_dof = [1]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Roller condition on y positive face
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.bc.bc_bottom]
label = bottom
label_value = 103
constrained_dof = [2]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Fixed base for restart verification
db_auxiliary_field.iohandler.filename = ../step00_elastic_cavity/bc_zero.spatialdb

[pylithapp.problem.materials.elastic]
db_auxiliary_field.iohandler.filename = material_initial.spatialdb
observers.observer.writer.filename = output/single-material.h5

[pylithapp.problem.solution_observers.domain]
writer.filename = output/single-domain.h5

[pylithapp.problem.solution_observers.ground_surface]
writer.filename = output/single-surface.h5
