[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axialstress"
version = "0.1.0"
description = "Postprocessing tools for the Axial Seamount stress-threshold replication"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Michael Hemmett", email = "mhemmett@uw.edu"}]
dependencies = ["h5py>=3.10", "numpy>=1.26", "PyYAML>=6", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
